# Photos for places, cities and stories.
#
# Each key gets one photo: the main image (P18) of a Wikidata item, hosted on Wikimedia Commons.
# A value can be
#   - a Chinese name, looked up on Wikidata:          city/leshan: 乐山大佛
#   - a Wikidata id:                                  place/beijing: Q80290
#   - a Commons file:                                 text/lun-leifengta: File:Leifeng Pagoda ruins.jpg
#   - "none" for no photo
# Cities not listed here use their own Wikidata photo.
#
# Run `npm run images` after editing; it only downloads what changed and writes content/images.lock.json
# (who took each photo and its licence). Only CC0, public domain, CC BY and CC BY-SA photos are kept.

