<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ED5126" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="中国通" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #fff; color: #ed5126;
        font: 900 30px/1 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif; letter-spacing: 0.08em }
      #splash i { display: block; width: 28px; height: 28px; margin: 18px auto 0; border-radius: 50%;
        border: 4px solid #e6e5e0; border-top-color: #2bae85; animation: splash 0.8s linear infinite }
      @keyframes splash { to { transform: rotate(360deg) } }
      @media (prefers-color-scheme: dark) { #splash { background: #15181c } #splash i { border-color: #343a41; border-top-color: #2bae85 } }
    </style>
    <title>中国通</title>
  </head>
  <body>
    <!-- Shown until the app draws its first screen (React replaces everything inside #root) -->
    <div id="root"><div id="splash"><div>中国通<i></i></div></div></div>
    <script>
      // If the app fails to start (a script error, or an old cached copy), say so instead of
      // showing a blank page, and offer a reload that skips the cache. Saved words are kept.
      (function () {
        var shown = false
        function show(msg) {
          var root = document.getElementById('root')
          if (shown || !root || !document.getElementById('splash')) return // the app is already up
          shown = true
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;padding:48px 24px;max-width:420px;margin:auto;color:#2b2b2b">' +
            '<h1 style="font-size:22px">中国通打不开了</h1>' +
            '<p style="color:#7d7d78;font-weight:600">点下面的按钮重新加载。生词和进度都还在。</p>' +
            '<pre style="white-space:pre-wrap;font-size:12px;background:#f4f4f2;padding:12px;border-radius:12px"></pre>' +
            '<button style="width:100%;height:52px;border:0;border-radius:16px;background:#ED5126;color:#fff;font-size:17px;font-weight:800">重新加载</button></div>'
          root.querySelector('pre').textContent = msg
          root.querySelector('button').onclick = function () {
            var jobs = []
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }))
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k) })) }))
            Promise.all(jobs).then(function () { location.reload() }, function () { location.reload() })
          }
        }
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && t !== window && t.tagName !== 'SCRIPT') return // a font or image failing is fine
          show((e.message || '脚本加载失败：' + (t && t.src)) + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''))
        }, true)
        window.addEventListener('unhandledrejection', function (e) { var r = e.reason; show(String((r && (r.stack || r.message)) || r)) })
        setTimeout(function () { show('加载超时（15秒）') }, 15000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
